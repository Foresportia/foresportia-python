name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check release tag matches package version
        run: |
          python -c 'import os, sys; from foresportia import __version__; tag = os.environ["GITHUB_REF_NAME"]; expected = "v" + __version__; sys.exit(f"Release tag {tag!r} does not match package version {expected!r}" if tag != expected else 0)'

      - name: Run SDK tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/foresportia

    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
